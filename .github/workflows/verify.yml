name: Verify

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
    outputs:
      commit:
        description: The verified source commit.
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 tools/release.py validate-tag "$RELEASE_TAG" "$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Record source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0
      - name: Build and test all distributions
        run: ./gradlew --no-daemon --max-workers=2 clean build prepareModCompatibility
      - name: Verify production clients and generation boundaries
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/verify_clients.py
      - name: Verify and stage all distributions
        run: ./gradlew --no-daemon --max-workers=2 stageRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: |
            build/distributions/legacy-visible-barrier-*.jar
            build/distributions/release.json
            build/distributions/SHA512SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-reports
          path: |
            core/build/test-results/
            core/build/reports/tests/
            build/reports/artifacts.json
            legacy-fabric/build/reports/smoke-test.txt
            legacy-fabric/build/reports/client.json
            legacy-fabric/build/reports/*SmokeTest/
            ornithe/gen*/build/reports/
            build/client-tests/**/result.json
            build/client-tests/**/smoke.txt
            build/client-tests/**/console.log
            build/client-tests/summary.json
          if-no-files-found: ignore
          retention-days: 14
