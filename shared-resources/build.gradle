plugins { id 'base' }

group = 'io.github.metaconscious.mod'
version = providers.gradleProperty('mod_version').get()

def resourcesJar = tasks.register('resourcesJar', Jar) {
    from layout.projectDirectory.dir('src/main/resources')
    archiveBaseName = 'legacy-visible-barrier-resources'
    destinationDirectory = layout.buildDirectory.dir('libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

configurations {
    resourceElements {
        canBeConsumed = true
        canBeResolved = false
        attributes.attribute(Attribute.of('io.github.metaconscious.lvb.content', String), 'resources')
    }
}

artifacts { resourceElements resourcesJar }
tasks.named('assemble') { dependsOn resourcesJar }
