plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'legacy-looming'
    id 'lvb.adapter-conventions'
}

legacyLooming {
    intermediaryVersion.set(target.generation as int)
    useLFIntermediary.set(true)
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://repo.legacyfabric.net/legacyfabric/' } }
        filter { includeGroupByRegex 'net\\.legacyfabric(\\..*)?' }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings legacy.yarn(minecraft_version, target.mapping_build.toString())
    modImplementation "net.fabricmc:fabric-loader:${target.loader_version}"
    modImplementation "${target.api_group}:legacy-fabric-api:${target.api_modules['legacy-fabric-api']}"
}
