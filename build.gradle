import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import net.fabricmc.loom.task.RemapJarTask

buildscript {
    configurations.classpath {
        resolutionStrategy.force 'net.fabricmc:fabric-loom:1.15.5'
    }
}

plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5' apply false
    id 'legacy-looming' version '1.15.3' apply false
    id 'ploceus' version '1.15.9' apply false
}

group = 'io.github.metaconscious.mod'
version = providers.gradleProperty('mod_version').get()

ext.targetCatalog = new JsonSlurper().parse(file('gradle/targets.json'))
ext.runtimeProfiles = new JsonSlurper().parse(file('gradle/runtime-profiles.json'))
def adapterProjects = targetCatalog.values().findAll { it.project }*.project
def forgeBuild = gradle.includedBuild('lvb-forge')

subprojects {
    plugins.withId('lvb.adapter-conventions') {
        // Optional production-namespace fixtures for mods that cannot run in Loom's named environment.
        def directory = layout.buildDirectory.dir('mod-compatibility')
        def smokeJar = tasks.register('compatibilitySmokeJar', Jar) {
            dependsOn configurations.bundledSmokeFixtures
            from sourceSets.smokeTest.output
            from({ configurations.bundledSmokeFixtures.collect { zipTree(it) } }) { exclude 'META-INF/**' }
            archiveFileName = "${targetId}-smoke-dev.jar"
            destinationDirectory = directory
        }
        def remappedSmoke = tasks.register('remapCompatibilitySmoke', RemapJarTask) {
            inputFile = smokeJar.flatMap { it.archiveFile }
            archiveFileName = "${targetId}-smoke.jar"
            destinationDirectory = directory
            addNestedDependencies = false
            classpath.from(sourceSets.main.output)
        }

        tasks.register('prepareModCompatibility') {
            group = 'verification'
            description = 'Prepares remapped client tests and a local launch manifest for third-party mods.'
            dependsOn remappedSmoke, tasks.named('remapJar'), tasks.named('downloadAssets'), tasks.named('configureLaunch')
            doLast {
                // Use published API JARs, not their named development copies.
                def dependencies = (configurations.modImplementation.dependencies + configurations.modRuntimeOnly.dependencies)
                        .collect { it.copy() }
                def mods = configurations.detachedConfiguration(*dependencies).resolve()
                def minecraft = loom.minecraftProvider
                def productionClasspath = (sourceSets.smokeTest.runtimeClasspath.files -
                        [loom.mappingConfiguration.tinyMappingsJar.toFile()]) + configurations.verificationMappings.files
                def launch = [
                        platform: target.platform,
                        target: targetId,
                        version: project.version,
                        menu_mods: configurations.menuTestMods.files.collect { it.path },
                        mapping: [generation: target.generation, minecraft: minecraft_version,
                                  namespace: target.mapping_family, build: target.mapping_build],
                        jvm_args: target.jvm_args ?: [],
                        java: tasks.named('runSmokeTest').get().javaLauncher.get().executablePath.asFile.path,
                        classpath: productionClasspath.collect { it.path },
                        core: configurations.bundledCore.singleFile.path,
                        bundled: (configurations.bundledCore + configurations.bundledAdapter
                                + configurations.bundledSmokeFixtures).files.collect { it.path },
                        minecraft: minecraft.minecraftClientJar.path,
                        assets: new File(loom.files.userCache, 'assets').path,
                        assetIndex: minecraft.versionInfo.assetIndex().fabricId(minecraft.minecraftVersion()),
                        natives: configurations.minecraftNatives.files.collect { it.path },
                        mods: mods.collect { it.path } + [tasks.named('remapJar').get().archiveFile.get().asFile.path,
                                                        remappedSmoke.get().archiveFile.get().asFile.path]
                ]
                if (target.mod_menu.additional_test) {
                    def extra = target.mod_menu.additional_test
                    def resolveFiles = { coordinates ->
                        def configuration = configurations.detachedConfiguration(*coordinates.collect { project.dependencies.create(it) })
                        configuration.transitive = false
                        configuration.files.collect { it.path }
                    }
                    launch.menu_additional = [mods: resolveFiles([extra.coordinate]),
                            api: resolveFiles(extra.api_modules.collect { module, revision -> "${target.api_group}:${module}:${revision}" })]
                }
                if (target.platform == 'ornithe') {
                    def replaced = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                            .findAll { artifact ->
                                def id = artifact.moduleVersion.id
                                id.group == 'org.ow2.asm' || id.group == 'net.fabricmc' &&
                                        id.name in ['fabric-loader', 'sponge-mixin', 'fabric-log4j-util']
                            }*.file
                    launch.runtimes = [quilt: [
                            main_class: runtimeProfiles.quilt.main_class,
                            classpath: ((productionClasspath - replaced)
                                    + configurations.quiltRuntime.files).collect { it.path },
                            jvm_args: ['-Dloader.gameVersion=1.8.9', '-Dloader.disableErrorGui=true'] +
                                    (target.generation == 2 ? ['-Dloader.fixPackageAccess=true'] : [])
                    ]]
                }
                directory.get().file('launch.json').asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(launch)) + '\n'
            }
        }
    }
}

tasks.named('updateDaemonJvm') {
    languageVersion = JavaLanguageVersion.of(21)
    toolchainPlatforms = [
            org.gradle.platform.OperatingSystem.LINUX,
            org.gradle.platform.OperatingSystem.MAC_OS,
            org.gradle.platform.OperatingSystem.WINDOWS
    ].collectMany { os ->
        [org.gradle.platform.Architecture.X86_64, org.gradle.platform.Architecture.AARCH64].collect { arch ->
            BuildPlatformFactory.of(arch, os)
        }
    }
}

configurations {
    coreArchive { canBeConsumed = false; transitive = false }
    distributions { canBeConsumed = false; transitive = false }
}

dependencies {
    coreArchive project(path: ':core', configuration: 'runtimeElements')
    adapterProjects.each { path ->
        distributions project(path: path, configuration: 'productionJarElements')
    }
    distributions("io.github.metaconscious.mod:lvb-forge:${version}+forge") {
        attributes { attribute(Attribute.of('io.github.metaconscious.lvb.content', String), 'distribution') }
    }
}

tasks.register('verifyArtifacts', Exec) {
    group = 'verification'
    description = 'Builds and checks every distribution, mappings, core, bytecode and resources.'
    dependsOn configurations.coreArchive, configurations.distributions
    dependsOn adapterProjects.collect { "${it}:prepareVerificationMappings" }
    dependsOn forgeBuild.task(':prepareVerificationMappings')
    inputs.files(configurations.coreArchive, configurations.distributions)
    inputs.dir 'shared-resources/src/main/resources/assets'
    inputs.files 'tools/verify_artifacts.py', 'tools/versions.py', 'gradle/targets.json'
    inputs.files(targetCatalog.values().collect { info ->
        file("${info.platform}/${info.build_directory}/verification/mappings/mappings.tiny")
    })
    inputs.property 'version', project.version
    outputs.file layout.buildDirectory.file('reports/artifacts.json')
    doFirst {
        commandLine 'python3', 'tools/verify_artifacts.py', '--base-version', project.version,
                '--core', configurations.coreArchive.singleFile,
                '--assets', file('shared-resources/src/main/resources/assets'),
                '--report', layout.buildDirectory.file('reports/artifacts.json').get().asFile
        targetCatalog.each { id, info ->
            def directory = file("${info.platform}/${info.build_directory}")
            args '--artifact', "${id}=${directory}/libs/legacy-visible-barrier-${version}+${id}.jar",
                    '--mappings', "${id}=${directory}/verification/mappings/mappings.tiny"
        }
    }
}

tasks.register('verifyDistributions') {
    group = 'verification'
    description = 'Verifies all distributions together.'
    dependsOn 'verifyArtifacts'
}

tasks.register('prepareModCompatibility') {
    group = 'verification'
    description = 'Prepares production client fixtures for all distributions and supported loaders.'
    dependsOn adapterProjects.collect { "${it}:prepareModCompatibility" }
    dependsOn forgeBuild.task(':prepareModCompatibility')
}

tasks.register('testReleaseTools', Exec) {
    group = 'verification'
    description = 'Tests release, artifact and compatibility tooling with local fixtures.'
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'
}

tasks.register('smokeTest', Exec) {
    group = 'verification'
    description = 'Runs production client contracts in isolated directories; requires a display.'
    dependsOn 'prepareModCompatibility'
    commandLine 'python3', 'tools/verify_clients.py', '--output', layout.buildDirectory.dir('client-tests').get().asFile
    doFirst { delete layout.buildDirectory.dir('client-tests') }
}

tasks.register('stageRelease', Exec) {
    group = 'distribution'
    description = 'Stages the verified JARs and release manifest from a clean checkout.'
    dependsOn 'verifyDistributions'
    doFirst {
        commandLine 'python3', 'tools/release.py', 'stage', '--base-version', project.version,
                '--report', layout.buildDirectory.file('reports/artifacts.json').get().asFile,
                '--output', layout.buildDirectory.dir('distributions').get().asFile
        targetCatalog.each { id, info ->
            def directory = file("${info.platform}/${info.build_directory}")
            args '--artifact', "${id}=${directory}/libs/legacy-visible-barrier-${version}+${id}.jar"
        }
        if (providers.gradleProperty('releaseTag').present) {
            args '--tag', providers.gradleProperty('releaseTag').get()
        }
    }
}

tasks.named('check') {
    dependsOn ':core:check', ':client-support:check', ':ornithe:check', 'verifyArtifacts', 'testReleaseTools'
    dependsOn adapterProjects.collect { "${it}:check" }
    dependsOn forgeBuild.task(':check')
}
tasks.named('clean') { dependsOn forgeBuild.task(':clean') }
tasks.named('assemble') {
    dependsOn configurations.distributions
}
