plugins {
    id 'fabric-loom'
    id 'ploceus'
    id 'lvb.adapter-conventions'
}

ploceus { generation.set(1) }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ornithemc.net/releases/' } }
        filter { includeGroupByRegex 'net\\.ornithemc(\\..*)?' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings ploceus.featherMappings(ornithe_feather_build)
    modImplementation "net.fabricmc:fabric-loader:${ornithe_loader_version}"
    modImplementation "net.ornithemc.osl:core:${osl_core_version}"
    modImplementation "net.ornithemc.osl:keybinds:${osl_keybinds_version}"
    modImplementation "net.ornithemc.osl:lifecycle-events:${osl_lifecycle_version}"
    modRuntimeOnly "net.ornithemc.osl:entrypoints:${osl_entrypoints_version}"
    modRuntimeOnly "net.ornithemc.osl:resource-loader:${osl_resources_version}"
}

loom {
    mixin { defaultRefmapName = 'lvb-ornithe.refmap.json' }
}
