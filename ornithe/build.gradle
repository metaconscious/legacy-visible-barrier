plugins {
    id 'lvb.java-conventions'
    id 'java-test-fixtures'
    id 'net.fabricmc.fabric-loom-companion'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
}

configurations.testFixturesCompileOnly.extendsFrom configurations.compileOnly

dependencies {
    implementation project(':core')
    compileOnly "net.fabricmc:fabric-loader:${rootProject.targetCatalog.ornithe.loader_version}"
    compileOnly('net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7') { transitive = false }
    compileOnly 'org.ow2.asm:asm-tree:9.9'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.19.0'
    testFixturesCompileOnly 'com.google.code.gson:gson:2.10'
    testFixturesCompileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
}
