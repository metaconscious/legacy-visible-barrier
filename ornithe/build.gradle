plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'ploceus'
    id 'lvb.adapter-conventions'
}

ploceus { setIntermediaryGeneration(target.generation as int) }

sourceSets {
    main.java.srcDir "src/gen${target.generation}/java"
    smokeTest.java.srcDir "src/gen${target.generation}SmokeTest/java"
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ornithemc.net/releases/' } }
        filter { includeGroupByRegex 'net\\.ornithemc(\\..*)?' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings ploceus.featherMappings(target.mapping_build.toString())
    modImplementation "net.fabricmc:fabric-loader:${target.loader_version}"
    target.api_modules.each { module, moduleVersion ->
        add(target.runtime_modules.contains(module) ? 'modRuntimeOnly' : 'modImplementation',
                "${target.api_group}:${module}:${moduleVersion}")
    }
}
