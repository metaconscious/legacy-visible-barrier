pluginManagement {
    includeBuild('build-logic')
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.legacyfabric.net/' }
        maven { url = 'https://maven.ornithemc.net/releases/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'legacy-visible-barrier'
include 'core', 'client-support', 'shared-resources', 'legacy-fabric', 'ornithe'
include 'ornithe:gen1', 'ornithe:gen2'

includeBuild('.')
includeBuild('forge') { name = 'lvb-forge' }
